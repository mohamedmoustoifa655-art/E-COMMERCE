body{

nav{
    display: flex;

    height: 50px;
}
nav .logo{
    align-items: center;
    display: flex;
}

    width: 40px;

}
nav .logo h1{
    font-size: 22px;

}
nav .menu{
    display: flex;
    padding-top: 12px;
    margin-right: 25px;
}
nav .menu li{
    display: inline-block;
    list-style: none;
    padding-left: 10px;
}
nav .menu li a{
    text-decoration: none;
    display: block;
    color: white;
    font-size: 25px;
    font-weight: bold;
    margin-left: 10px;
}
nav .menu li a:hover{
    border-bottom: 2px solid rgb(247, 250, 250);
    cursor: pointer;
    color: rgb(247, 227, 7);
}

/* Ceci est le responsive design  */
@media screen and (max-width: 768px) {
    nav{
        display: flex;
    }
    /* ceci est un sous media screen à la taille de 500px */
    @media screen and (max-width: 610px){
        nav .logo h1{
            font-size: 10px;
        }
        nav .logo img{
            height: 30px;
            width: 20px;
        }
        nav .menu li a{
            font-size: 15px;
            margin-top: 10px;
        }
    }
    @media screen and (max-width: 425px){
        nav .logo h1{
            font-size: 8px;
        }
        nav .logo img{
            height: 20px;
            width: 15px;
        }
        nav .menu li a{
            font-size: 12px;
            margin-top: 10px;
        }

    @media screen and (max-width: 368px){

        }

            margin-top: 15px;
        }

    @media screen and (max-width: 400px){
        header h1{

        }

        }

        }
    }
    @media screen and (max-width: 368px){
        header h1{

        }
        header p{

        }
        header button{
            width: 90px;
            height: 20px;
            margin-top: -30px;
        } 
        header .test p{
            font-size: 10px;
        }
    }
    @media screen and (max-width: 800px){
        .contenu .sous_contenu .bloc1{

            display: flex;
            align-items: center;

    }
    @media screen and (max-width: 600px){

            flex-direction: column;

        }
    }
